<!DOCTYPE html>
<html>
<head>
<title>Neon Geometry Dash Clone</title>
<style>
body {
    margin:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
canvas {
    border:3px solid cyan;
}
</style>
</head>
<body>
<canvas id="game" width="900" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const groundY = 330;

const playerImg = new Image();
playerImg.src = "player.png";

const rocketImg = new Image();
rocketImg.src = "rocket_player.png";

const bgImg = new Image();
bgImg.src = "bg.jpg";

let player, obstacles, platforms, portals, particles;
let speed, score, highScore;
let gameOver, started, paused, angle;
let mode = "cube"; // cube or rocket
let bgX = 0;

highScore = localStorage.getItem("highScore") || 0;

function resetGame(){
    player = {
        x:100,
        y:groundY-40,
        size:40,
        dy:0,
        gravity:0.8,
        jumpPower:-14,
        grounded:true
    };
    obstacles=[];
    platforms=[];
    portals=[];
    particles=[];
    speed=5;
    score=0;
    angle=0;
    gameOver=false;
    started=false;
    paused=false;
    mode="cube";
}

resetGame();

// CONTROLS
document.addEventListener("keydown", e=>{
    if(e.code==="KeyP") paused=!paused;

    if(e.code==="Space"){
        if(gameOver){
            resetGame();
            started=true;
            requestAnimationFrame(update);
            return;
        }
        if(!started) started=true;

        if(mode==="cube") jump();
        if(mode==="rocket") player.dy = -6;
    }
});

document.addEventListener("click", ()=>{
    if(gameOver){
        resetGame();
        started=true;
        requestAnimationFrame(update);
        return;
    }
    if(!started) started=true;

    if(mode==="cube") jump();
    if(mode==="rocket") player.dy = -6;
});

function jump(){
    if(player.grounded){
        player.dy = player.jumpPower;
        player.grounded=false;
    }
}

// GENERATORS
setInterval(()=>createObstacle(),1500);
setInterval(()=>createPlatform(),3000);
setInterval(()=>createPortal(),6000);

function createObstacle(){
    let h = Math.random()*40+30;
    obstacles.push({
        x:canvas.width,
        y:groundY-h,
        w:30,
        h:h
    });
}

function createPlatform(){
    platforms.push({
        x:canvas.width,
        y:Math.random()*100+180,
        w:90,
        h:15,
        dir:Math.random()>0.5?1:-1
    });
}

function createPortal(){
    portals.push({
        x:canvas.width,
        y:groundY-60,
        size:40
    });
}

// PARTICLES
function createParticles(){
    for(let i=0;i<30;i++){
        particles.push({
            x:player.x+20,
            y:player.y+20,
            dx:(Math.random()-0.5)*6,
            dy:(Math.random()-0.5)*6,
            life:50
        });
    }
}

function drawTriangle(o){
    ctx.shadowBlur=20;
    ctx.shadowColor="white";
    ctx.fillStyle="black";
    ctx.beginPath();
    ctx.moveTo(o.x,o.y+o.h);
    ctx.lineTo(o.x+o.w/2,o.y);
    ctx.lineTo(o.x+o.w,o.y+o.h);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur=0;
}

function update(){
    if(paused){
        ctx.fillStyle="white";
        ctx.font="40px Arial";
        ctx.fillText("PAUSED",400,200);
        return requestAnimationFrame(update);
    }

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // SCROLLING BG
    bgX -= speed/2;
    if(bgX <= -canvas.width) bgX = 0;
    ctx.drawImage(bgImg,bgX,0,canvas.width,canvas.height);
    ctx.drawImage(bgImg,bgX+canvas.width,0,canvas.width,canvas.height);

    if(!started){
        ctx.fillStyle="cyan";
        ctx.font="40px Arial";
        ctx.fillText("NEON DASH",350,180);
        ctx.font="20px Arial";
        ctx.fillText("Press Space or Click",360,230);
        return requestAnimationFrame(update);
    }

    if(gameOver){
        createParticles();
        if(score>highScore){
            highScore=score;
            localStorage.setItem("highScore",highScore);
        }
        ctx.fillStyle="yellow";
        ctx.font="40px Arial";
        ctx.fillText("GAME OVER",350,180);
        ctx.font="20px Arial";
        ctx.fillText("Click or Space to Restart",310,230);
        return;
    }

    // PHYSICS
    player.dy += player.gravity;
    player.y += player.dy;
    player.grounded=false;

    if(player.y+player.size>=groundY){
        player.y=groundY-player.size;
        player.dy=0;
        player.grounded=true;
        angle=0;
    }

    // PLATFORMS
    for(let p of platforms){
        p.x-=speed;
        p.y+=p.dir*0.5;
        if(p.y<150||p.y>300) p.dir*=-1;

        ctx.shadowBlur=20;
        ctx.shadowColor="purple";
        ctx.fillStyle="purple";
        ctx.fillRect(p.x,p.y,p.w,p.h);
        ctx.shadowBlur=0;

        if(
            player.x<p.x+p.w &&
            player.x+player.size>p.x &&
            player.y+player.size<=p.y+10 &&
            player.y+player.size>=p.y
        ){
            player.y=p.y-player.size;
            player.dy=0;
            player.grounded=true;
        }
    }

    // PLAYER
    ctx.save();
    ctx.translate(player.x+20,player.y+20);
    if(mode==="cube"){
        angle+=0.1;
        ctx.rotate(angle);
        ctx.shadowBlur=20;
        ctx.shadowColor="cyan";
        ctx.drawImage(playerImg,-20,-20,40,40);
    } else {
        ctx.shadowBlur=20;
        ctx.shadowColor="orange";
        ctx.drawImage(rocketImg,-20,-20,40,40);
    }
    ctx.restore();

    // OBSTACLES
    for(let o of obstacles){
        o.x-=speed;
        drawTriangle(o);

        if(
            player.x<o.x+o.w &&
            player.x+player.size>o.x &&
            player.y<o.y+o.h &&
            player.y+player.size>o.y
        ){
            gameOver=true;
        }
    }

    // PORTALS
    for(let po of portals){
        po.x-=speed;
        ctx.shadowBlur=25;
        ctx.shadowColor="lime";
        ctx.strokeStyle="lime";
        ctx.strokeRect(po.x,po.y,po.size,po.size);
        ctx.shadowBlur=0;

        if(
            player.x<po.x+po.size &&
            player.x+player.size>po.x &&
            player.y<po.y+po.size &&
            player.y+player.size>po.y
        ){
            mode = mode==="cube" ? "rocket" : "cube";
        }
    }

    // PARTICLES
    for(let i=particles.length-1;i>=0;i--){
        let p=particles[i];
        ctx.fillStyle="white";
        ctx.fillRect(p.x,p.y,3,3);
        p.x+=p.dx;
        p.y+=p.dy;
        p.life--;
        if(p.life<=0) particles.splice(i,1);
    }

    obstacles = obstacles.filter(o=>o.x+o.w>0);
    platforms = platforms.filter(p=>p.x+p.w>0);
    portals = portals.filter(p=>p.x+p.size>0);

    score++;
    if(score%500===0) speed++;

    ctx.fillStyle="white";
    ctx.font="18px Arial";
    ctx.fillText("Score: "+score,20,25);
    ctx.fillText("High: "+highScore,20,45);
    ctx.fillText("Mode: "+mode.toUpperCase(),20,65);

    requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
